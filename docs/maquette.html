<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <!-- Barre de navigation -->
    <nav class="bg-gray-800 p-4 flex items-center justify-between">
        <div class="flex items-center space-x-6">
            <h1 class="text-xl font-bold">VM Manager</h1>
            <button class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition-colors">Nouvelle VM</button>
        </div>
        <div class="flex items-center space-x-4">
            <button class="p-2 rounded-full hover:bg-gray-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
                </svg>
            </button>
        </div>
    </nav>

    <div class="p-6">
        <!-- Cartes des VMs -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Carte VM 1 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg hover:bg-gray-750 transition-colors">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">VM Debian</h2>
                        <p class="text-sm text-gray-300">ID: 001</p>
                    </div>
                    <span class="px-3 py-1 bg-green-500 rounded-full text-sm">Running</span>
                </div>

                <!-- Barres de progression -->
                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-medium mb-1">CPU Usage</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-75"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Memoire</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-40"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Espace disque</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-30"></div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="mt-6 flex justify-between items-center pt-4 border-t border-gray-700">
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-blue-500 rounded hover:bg-blue-600 transition-colors">
                            <span>Redémarrer</span>
                        </button>
                        <button class="px-3 py-1 bg-red-500 rounded hover:bg-red-600 transition-colors">
                            <span>Arrêter</span>
                        </button>
                    </div>
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition-colors">
                            <span>Supprimer</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Carte VM 2 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg hover:bg-gray-750 transition-colors">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">VM Windows</h2>
                        <p class="text-sm text-gray-300">ID: 002</p>
                    </div>
                    <span class="px-3 py-1 bg-green-500 rounded-full text-sm">Running</span>
                </div>

                <!-- Barres de progression -->
                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-medium mb-1">CPU Usage</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-60"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Memoire</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-30"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Espace disque</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-20"></div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="mt-6 flex justify-between items-center pt-4 border-t border-gray-700">
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-blue-500 rounded hover:bg-blue-600 transition-colors">
                            <span>Redémarrer</span>
                        </button>
                        <button class="px-3 py-1 bg-red-500 rounded hover:bg-red-600 transition-colors">
                            <span>Arrêter</span>
                        </button>
                    </div>
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition-colors">
                            <span>Supprimer</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Carte VM 3 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg hover:bg-gray-750 transition-colors">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">VM Centos</h2>
                        <p class="text-sm text-gray-300">ID: 003</p>
                    </div>
                    <span class="px-3 py-1 bg-gray-500 rounded-full text-sm">Arrêté</span>
                </div>

                <!-- Barres de progression -->
                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-medium mb-1">CPU Usage</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-10"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Memoire</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-15"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium mb-1">Espace disque</label>
                        <div class="w-full bg-gray-700 rounded h-2">
                            <div class="bg-blue-500 h-2 rounded from-0 to-10"></div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="mt-6 flex justify-between items-center pt-4 border-t border-gray-700">
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-blue-500 rounded hover:bg-blue-600 transition-colors">
                            <span>Redémarrer</span>
                        </button>
                        <button class="px-3 py-1 bg-red-500 rounded hover:bg-red-600 transition-colors">
                            <span>Arrêter</span>
                        </button>
                    </div>
                    <div class="flex space-x-3">
                        <button class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition-colors">
                            <span>Supprimer</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Boutons flottants -->
        <div class="fixed bottom-4 right-4 flex space-x-3">
            <button class="bg-blue-500 rounded-full w-12 h-12 flex items-center justify-center shadow-lghover:bg-blue-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                </svg>
            </button>
            <button class="bg-green-500 rounded-full w-12 h-12 flex items-center justify-center shadow-lg hover:bg-green-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </button>
        </div>
    </div>
</body>
</html>
